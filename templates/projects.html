{% extends "base.html" %}
{% block meta %}
    <title>Projects - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Projects I've Done</p>
                <div class="project-header">
                    <h1>Projects</h1>
                    {% if user.is_superuser %}
                    <a href="{% url 'main:create_project' %}"
                       class="button project-add-button">
                        <span aria-hidden="true">+</span>
                        Add Project
                    </a>
                    {% endif %}
                </div>
                <form id="project-search-form" class="project-search">
                    <input type="search"
                        id="search-input"
                        name="title"
                        value="{{ title_query }}"
                        placeholder="Search a project..."
                        class="project-search__input"
                        aria-label="Search a project...">
                    <button type="submit" class="button">Search</button>
                </form>

                <!-- Loading State -->
                <div id="loading" class="empty-state hide">
                    <p>Loading projects...</p>
                </div>

                <!-- Error State -->
                <div id="error" class="empty-state hide">
                    <p>Fail to load projects data. Please try again.</p>
                </div>

                <!-- Empty State -->
                <div id="empty" class="empty-state hide">
                    <p>No project found.</p>
                </div>

                <!-- Project Grid -->
                <div id="grid" class="experience-grid project-grid hide"></div>
            </div>
        </section>
    </main>

    <script>
    // Konfigurasi
    const BASE_PROJECTS_ENDPOINT = "{% url 'main:get_projects_json' %}";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    const IS_EDITOR = "{{ is_editor|yesno:'true,false' }}" === "true";
    let projectsAbortController;

    // Elemen DOM
    const loadingState = document.getElementById('loading');
    const errorState = document.getElementById('error');
    const emptyState = document.getElementById('empty');
    const gridContainer = document.getElementById('grid');
    const searchForm = document.getElementById('project-search-form');
    const searchInput = document.getElementById('search-input');

    // Menyembunyikan/Menampilkan section halaman
    function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showGrid = false }) {
        loadingState.classList.toggle('hide', !showLoading);
        errorState.classList.toggle('hide', !showError);
        emptyState.classList.toggle('hide', !showEmpty);
        gridContainer.classList.toggle('hide', !showGrid);
    }

    // Membuat elemen card project
    function buildProjectCardElement(item) {
        const project = item.fields;
        const projectId = item.pk;

        const articleElement = document.createElement('article');
        articleElement.className = 'experience-card';

        const imageHtml = project.thumbnail 
            ? `<img src="${project.thumbnail}" alt="Gambar ${project.title}" class="project-image">`
            : '';

        const urlHtml = project.link 
            ? `<a href="${project.link}" class="button">See Project</a>`
            : '';

        // Dummy angka untuk digantikan oleh ID asli dari data JSON
        // (URL proyek memakai <int:...> jadi dummy-nya harus angka)
        const editUrl = "{% url 'main:update_project' 999999 %}"
            .replace('999999', projectId);
        const deleteUrl = "{% url 'main:delete_project' 999999 %}"
            .replace('999999', projectId);
        const starUrl = "{% url 'main:toggle_star' 999999 %}"
            .replace('999999', projectId);

        const editHtml = (IS_SUPERUSER || IS_EDITOR)
            ? `<a href="${editUrl}" class="button button-secondary">Edit</a>`
            : '';

        const deleteHtml = IS_SUPERUSER 
            ? `<form method="post" action="${deleteUrl}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="button button-danger" onclick="return confirm('Yakin ingin menghapus project ini?');">Hapus</button>
            </form>`
            : '';

        const isStarredClass = project.is_starred ? " is-starred" : "";
        const starText = project.is_starred ? "Unstar" : "Star";
        const starTitle = project.star_count > 0 
            ? `Dibintangi oleh ${project.starred_by_names}` 
            : "Jadilah yang pertama memberi star";

        // Komponen card
        const completeCardHtml = `
            ${imageHtml}
            <h2>${project.title}</h2>
            <p class="experience-description">${project.description}</p>
            <div class="project-card-actions">
                <div class="project-actions">
                    ${urlHtml}
                    ${editHtml}
                    <form method="post" action="${starUrl}" class="star-form">
                        {% csrf_token %}
                        <button type="submit" 
                                class="button button-star${isStarredClass}"
                                title="${starTitle}">
                            <span aria-hidden="true">★</span>
                            ${starText}
                            <span class="star-count">${project.star_count}</span>
                        </button>
                    </form>

                    ${deleteHtml}
                </div>
            </div>
        `;

        articleElement.innerHTML = completeCardHtml;
        return articleElement;
    }

    // Fetch data project
    async function fetchProjects(searchQuery = "") {
        if (projectsAbortController) projectsAbortController.abort();
        projectsAbortController = new AbortController();

        try {
            displayPageSection({ showLoading: true });
            
            const url = searchQuery ? `${BASE_PROJECTS_ENDPOINT}?title=${encodeURIComponent(searchQuery)}` : BASE_PROJECTS_ENDPOINT;
            
            const response = await fetch(url, {
                headers: { 'Accept': 'application/json' },
                signal: projectsAbortController.signal,
            });

            if (!response.ok) throw new Error('Failed to fetch data');

            const projectData = await response.json();

            if (projectData.length === 0) {
                displayPageSection({ showEmpty: true });
            } else {
                gridContainer.innerHTML = '';
                projectData.forEach(item => {
                    gridContainer.appendChild(buildProjectCardElement(item));
                });
                displayPageSection({ showGrid: true });
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('Error loading projects:', error);
            displayPageSection({ showError: true });
        }
    }

    // Event Handlers untuk Form Search
    searchForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload halaman
        fetchProjects(searchInput.value.trim()); // Jalankan pencarian via AJAX
    });

    // Start application
    fetchProjects(searchInput.value.trim());
    </script>
{% endblock content %}
