{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Kayla Ali, Information Systems student at Universitas Indonesia.">
    <title>{{ name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %} {% endblock meta %}
</head>

<body>
    <!-- navbar, isinya logo hati sama nama sama tombol menu -->
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">
                <img class="brand-heart" src="/static/img/heart.png" alt="">
                {{ name }}
            </a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experiences' %}">Experiences</a>
            </nav>
        </div>
    </header>
    {% block content %} {% endblock content %}

    <!-- footer, ada ikcon2 sosmed sama gambar kelinci :> -->
    <footer class="collab-footer">
        <div class="collab-inner">
            <div class="collab-left">
                <h2 class="collab-title">Let's Collab!</h2>
                <div class="collab-icons">
                    <a href="https://github.com/kayylaal" aria-label="GitHub">
                        <img src="/static/img/github.png" alt="GitHub" loading="lazy" decoding="async">
                    </a>
                    <a href="https://line.me/ti/p/U0RPewow1G" aria-label="LINE">
                        <img src="/static/img/line.png" alt="LINE" loading="lazy" decoding="async">
                    </a>
                    <a href="mailto:kaylakiranali11@gmail.com" aria-label="Email">
                        <img src="/static/img/mail.png" alt="Email" loading="lazy" decoding="async">
                    </a>
                    <a href="https://www.instagram.com/kayylaal/" aria-label="Instagram">
                        <img src="/static/img/instagram.png" alt="Instagram" loading="lazy" decoding="async">
                    </a>
                    <a href="https://www.linkedin.com/in/kayla-kirana-ali-trimardhany/" aria-label="LinkedIn">
                        <img src="/static/img/linkedin.png" alt="LinkedIn" loading="lazy" decoding="async">
                    </a>
                </div>
                <p>&copy; @2026 {{ name }} -- please hit me up!! ♥︎</p>
            </div>
            <div class="collab-right">
                <img class="collab-heart" src="/static/img/bunnies.png" alt="Pixel bunnies" loading="lazy" decoding="async">
            </div>
        </div>
    </footer>

</body>
</html>
