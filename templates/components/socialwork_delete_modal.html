<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-socialwork-{{ sw.id }}"
            aria-label="Delete {{ sw.title }}"
            title="Delete social work">
        Delete
    </button>
</p>
<div id="delete-socialwork-{{ sw.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-socialwork-title-{{ sw.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-socialwork-{{ sw.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-socialwork-{{ sw.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-socialwork-title-{{ sw.id }}">Delete Social Work?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ sw.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-socialwork-{{ sw.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_socialworks' sw.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
