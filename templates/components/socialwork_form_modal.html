<div id="add-socialwork-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-socialwork-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-socialwork-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah social work"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-socialwork-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah social work">×</button>

        <h2 id="add-socialwork-modal-title">Tambah Social Work Baru</h2>
        <form id="socialwork-form"
              method="post"
              action="{% url 'main:create_socialworks' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-socialwork-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Social Work</button>
            </div>
        </form>
    </div>
</div>
