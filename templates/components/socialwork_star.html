<form method="post" action="{% url 'main:toggle_socialwork_star' socialwork.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in socialwork.starred_by.all %} is-starred{% endif %}"
            title="{% if socialwork.starred_by.all %}Starred by {{ socialwork.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in socialwork.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ socialwork.starred_by.count }}</span>
    </button>
</form>
