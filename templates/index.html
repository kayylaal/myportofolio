<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Kayla Ali, Information Systems student at Universitas Indonesia.">
    <title>Kayla Ali</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main>
    <section class="hero" id="profile">
        <div class="container hero-stage">
            <div class="hero-layout">
                <div class="hero-col hero-col-left">
                    <!-- ini h1nya cuma satu aja buat nama lengkap "Kayla Ali" biar struktur headingnya bener, yang "Ali" di kanan itu cuma span hiasan aja, disembunyiin dari screen reader biar ga kebaca dua kali -->
                    <h1 class="hero-name hero-name-left" aria-label="Kayla Ali">Kayla</h1>
                    <p class="bio">Second year information Systems student<br>at University of Indonesia.</p>
                    <p class="tagline">I design, code, and have fun!</p>
                </div>
                <div class="hero-photo">
                    <img class="avatar" src="/static/img/Kayla_1.png" alt="Photo of Kayla" fetchpriority="high">
                </div>
                <div class="hero-col hero-col-right">
                    <span class="hero-name hero-name-right" aria-hidden="true">Ali</span>
                    <!-- tombol tombol link -->
                    <div class="social-links">
                        <a href="https://github.com/kayylaal" class="social-link">Github</a>
                        <a href="https://www.linkedin.com/in/kayla-kirana-ali-trimardhany/" class="social-link">LinkedIn</a>
                        <a href="mailto:kaylakiranali11@gmail.com" class="social-link">Email me!</a>
                    </div>
                </div>
            </div>

        </div>
    </section>
    <section class="projects" id="projects">
        <div class="projects-inner">
            <div class="section-head">
                <h2 class="section-title">Projects</h2>
                <img class="section-deco" loading="lazy" decoding="async" src="/static/img/art.png" alt="">
            </div>
            <!-- tiap card dibungkus <a> biar foto sama namanya sama-sama bisa diklik. labelnya ganjil di bawah genap di atas, ngikutin css-nya. belum ditambahin linknya maaf karena link2 figmanya masih error plis -->
            <div class="projects-track" id="projectsTrack">
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/susunjadwal.png" alt="SusunJadwal">
                    <span class="project-tag">SusunJadwal</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/compfest18.png" alt="Compfest 18">
                    <span class="project-tag">Compfest 18</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/oh26.png" alt="Open House Fasilkom 2026">
                    <span class="project-tag">Open House<br>Fasilkom 2026</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/oh25.png" alt="Open House Fasilkom 2025">
                    <span class="project-tag">Open House<br>Fasilkom 2025</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/nomnom.png" alt="NomNom">
                    <span class="project-tag">NomNom</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/apollo.png" alt="Apollo">
                    <span class="project-tag">Apollo</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/tinted.png" alt="tinted!">
                    <span class="project-tag">tinted!</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/glee.png" alt="glee">
                    <span class="project-tag">glee</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/fiery.png" alt="Fiery">
                    <span class="project-tag">Fiery</span>
                </a>
                <a class="project-card" href="#">
                    <img class="project-thumb" loading="lazy" decoding="async" src="/static/img/marquee.png" alt="marquee">
                    <span class="project-tag">marquee</span>
                </a>
                <span class="projects-more">...and more to come...</span>
            </div>
        </div>
    </section>
</main>
</body>
</html>
