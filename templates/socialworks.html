{% extends "base.html" %}
{% block meta %}
    <title>Social Works - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Social Works I've Been A Part Of</p>
                <div class="project-header">
                    <h1>Social Works</h1>
                </div>

                <form id="socialwork-search-form" class="project-search">
                    <input type="search"
                        id="search-input"
                        name="title"
                        placeholder="Search a social work..."
                        class="project-search__input"
                        aria-label="Search a social work...">
                    <button type="submit" class="button">Search</button>
                </form>

                <!-- Loading State -->
                <div id="loading" class="empty-state hide">
                    <p>Loading social works...</p>
                </div>

                <!-- Error State -->
                <div id="error" class="empty-state hide">
                    <p>Fail to load social works data. Please try again.</p>
                </div>

                <!-- Empty State -->
                <div id="empty" class="empty-state hide">
                    <p>No social work found.</p>
                </div>

                <!-- Grid -->
                <div id="grid" class="experience-grid project-grid hide"></div>
            </div>
        </section>
    </main>

    <script>
    const BASE_SOCIALWORKS_ENDPOINT = "{% url 'main:get_socialworks_json' %}";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    const IS_EDITOR = "{{ is_editor|yesno:'true,false' }}" === "true";

    const loadingState = document.getElementById('loading');
    const errorState = document.getElementById('error');
    const emptyState = document.getElementById('empty');
    const gridContainer = document.getElementById('grid');

    function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showGrid = false }) {
        loadingState.classList.toggle('hide', !showLoading);
        errorState.classList.toggle('hide', !showError);
        emptyState.classList.toggle('hide', !showEmpty);
        gridContainer.classList.toggle('hide', !showGrid);
    }

    // cegah xss, jadiin teks biasa
    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function buildSocialWorkCardElement(item) {
        const sw = item.fields;
        const swId = item.pk;

        const articleElement = document.createElement('article');
        articleElement.className = 'experience-card';

        const imageHtml = sw.photo
            ? `<img src="${escapeHtml(sw.photo)}" alt="Gambar ${escapeHtml(sw.title)}" class="project-image">`
            : '';

        const yearHtml = sw.year
            ? `<p class="experience-status">${escapeHtml(sw.year)}</p>`
            : '';

        const editUrl = "{% url 'main:update_socialworks' 999999 %}".replace('999999', swId);
        const deleteUrl = "{% url 'main:delete_socialworks' 999999 %}".replace('999999', swId);
        const starUrl = "{% url 'main:toggle_socialwork_star' 999999 %}".replace('999999', swId);

        const editHtml = (IS_SUPERUSER || IS_EDITOR)
            ? `<a href="${editUrl}" class="button button-secondary">Edit</a>`
            : '';

        const deleteHtml = IS_SUPERUSER
            ? `<form method="post" action="${deleteUrl}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="button button-danger" onclick="return confirm('Yakin ingin menghapus social work ini?');">Hapus</button>
            </form>`
            : '';

        const isStarredClass = sw.is_starred ? " is-starred" : "";
        const starText = sw.is_starred ? "Unstar" : "Star";
        const starTitle = sw.star_count > 0
            ? `Dibintangi oleh ${escapeHtml(sw.starred_by_names)}`
            : "Jadilah yang pertama memberi star";

        articleElement.innerHTML = `
            ${imageHtml}
            <h2>${escapeHtml(sw.title)}</h2>
            ${yearHtml}
            <p class="experience-description">${escapeHtml(sw.description)}</p>
            <div class="project-card-actions">
                <div class="project-actions">
                    ${editHtml}
                    <form method="post" action="${starUrl}" class="star-form">
                        {% csrf_token %}
                        <button type="submit"
                                class="button button-star${isStarredClass}"
                                title="${starTitle}">
                            <span aria-hidden="true">★</span>
                            ${starText}
                            <span class="star-count">${sw.star_count}</span>
                        </button>
                    </form>
                    ${deleteHtml}
                </div>
            </div>
        `;
        return articleElement;
    }

    let socialworksAbortController;

    // ambil data pakai fetch
    async function fetchSocialWorks(searchQuery = "") {
        if (socialworksAbortController) socialworksAbortController.abort();
        socialworksAbortController = new AbortController();

        try {
            displayPageSection({ showLoading: true });
            const url = searchQuery ? `${BASE_SOCIALWORKS_ENDPOINT}?title=${encodeURIComponent(searchQuery)}` : BASE_SOCIALWORKS_ENDPOINT;
            const response = await fetch(url, {
                headers: { 'Accept': 'application/json' },
                signal: socialworksAbortController.signal,
            });
            if (!response.ok) throw new Error('Failed to fetch data');
            const data = await response.json();
            if (data.length === 0) {
                displayPageSection({ showEmpty: true });
            } else {
                gridContainer.innerHTML = '';
                data.forEach(item => {
                    gridContainer.appendChild(buildSocialWorkCardElement(item));
                });
                displayPageSection({ showGrid: true });
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('Error loading socialworks:', error);
            displayPageSection({ showError: true });
        }
    }

    const searchForm = document.getElementById('socialwork-search-form');
    const searchInput = document.getElementById('search-input');
    let searchDebounceTimer;

    // cari setelah berhenti ngetik 300ms
    searchInput.addEventListener("input", function() {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(function() {
            fetchSocialWorks(searchInput.value.trim());
        }, 300);
    });

    // cegah reload pas enter
    searchForm.addEventListener("submit", function(event) {
        event.preventDefault();
        clearTimeout(searchDebounceTimer);
        fetchSocialWorks(searchInput.value.trim());
    });

    fetchSocialWorks();
    </script>
{% endblock content %}
